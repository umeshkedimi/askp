name: 🐞 Bug report
description: Report a defect in the ASKP reference implementation or docs.
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For **security vulnerabilities, do not use this form** — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: When I ..., ASKP did ... instead of ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or a snippet.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Issuer
        - Gateway
        - Vault
        - Policy Engine
        - Admin API
        - SDK
        - Documentation
        - Specification
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. commit ab7923d, or v0.1.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, Docker version, deployment (compose/k8s)...
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any secrets, tokens, or provider keys before pasting.
      render: shell
